# Render.com deployment configuration
# This file tells Render how to deploy your application

services:
  # Backend API Service
  - type: web
    name: solar-fish-dryer-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT backend:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
    healthCheckPath: /api/health

  # Frontend Static Site (optional - can also deploy to Vercel)
  - type: web
    name: solar-fish-dryer-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
