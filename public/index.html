<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Fish Dryer ML System</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide React icons (inline SVG components)
        const Sun = () => <svg className="w-10 h-10 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>;
        const Droplets = ({ className = "w-4 h-4" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>;
        const Wind = ({ className = "w-4 h-4" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>;
        const Thermometer = ({ className = "w-4 h-4" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>;
        const Activity = ({ className = "w-4 h-4" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>;
        const Database = ({ className = "w-5 h-5" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" /></svg>;
        const TrendingUp = ({ className = "w-5 h-5" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>;
        const Upload = ({ className = "w-5 h-5" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>;
        const RefreshCw = ({ className = "w-5 h-5" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;
        const CheckCircle = ({ className = "w-5 h-5" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const AlertCircle = ({ className = "w-5 h-5" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;

        // MoistureChart Component - Simple Line Chart using Canvas
        const MoistureChart = ({ timeSeries }) => {
            const canvasRef = React.useRef(null);

            React.useEffect(() => {
                if (!canvasRef.current || !timeSeries || timeSeries.length === 0) return;

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;

                // Clear canvas
                ctx.clearRect(0, 0, width, height);

                // Chart configuration
                const padding = { top: 20, right: 20, bottom: 40, left: 50 };
                const chartWidth = width - padding.left - padding.right;
                const chartHeight = height - padding.top - padding.bottom;

                // Find min/max values
                const allValues = timeSeries.flatMap(p => [p.svr, p.decision_tree, p.ann, p.ensemble].filter(v => v !== undefined));
                const minMoisture = Math.max(0, Math.min(...allValues) - 5);
                const maxMoisture = Math.min(100, Math.max(...allValues) + 5);
                const maxHour = timeSeries[timeSeries.length - 1].hour;

                // Draw background
                ctx.fillStyle = '#f9fafb';
                ctx.fillRect(0, 0, width, height);

                // Draw grid lines
                ctx.strokeStyle = '#e5e7eb';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 5; i++) {
                    const y = padding.top + (chartHeight / 5) * i;
                    ctx.beginPath();
                    ctx.moveTo(padding.left, y);
                    ctx.lineTo(padding.left + chartWidth, y);
                    ctx.stroke();
                }

                // Draw axes
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(padding.left, padding.top);
                ctx.lineTo(padding.left, padding.top + chartHeight);
                ctx.lineTo(padding.left + chartWidth, padding.top + chartHeight);
                ctx.stroke();

                // Draw Y-axis labels
                ctx.fillStyle = '#374151';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'right';
                for (let i = 0; i <= 5; i++) {
                    const y = padding.top + (chartHeight / 5) * i;
                    const value = maxMoisture - ((maxMoisture - minMoisture) / 5) * i;
                    ctx.fillText(value.toFixed(0) + '%', padding.left - 10, y + 4);
                }

                // Draw X-axis labels
                ctx.textAlign = 'center';
                const xLabelInterval = Math.ceil(maxHour / 10);
                for (let i = 0; i <= maxHour; i += xLabelInterval) {
                    const x = padding.left + (chartWidth / maxHour) * i;
                    ctx.fillText(i + 'h', x, height - 10);
                }

                // Helper function to convert data point to canvas coordinates
                const getX = (hour) => padding.left + (chartWidth / maxHour) * hour;
                const getY = (moisture) => padding.top + chartHeight - ((moisture - minMoisture) / (maxMoisture - minMoisture)) * chartHeight;

                // Draw lines for each model
                const drawLine = (dataKey, color, lineWidth = 2) => {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = lineWidth;
                    ctx.beginPath();

                    let started = false;
                    timeSeries.forEach((point) => {
                        if (point[dataKey] !== undefined) {
                            const x = getX(point.hour);
                            const y = getY(point[dataKey]);
                            if (!started) {
                                ctx.moveTo(x, y);
                                started = true;
                            } else {
                                ctx.lineTo(x, y);
                            }
                        }
                    });
                    ctx.stroke();
                };

                // Draw all model lines
                drawLine('svr', '#9333ea', 2);          // Purple
                drawLine('decision_tree', '#16a34a', 2); // Green
                drawLine('ann', '#2563eb', 2);           // Blue
                drawLine('ensemble', '#ea580c', 3);      // Orange (thicker)

                // Draw target moisture line (15%)
                if (minMoisture <= 15 && maxMoisture >= 15) {
                    ctx.strokeStyle = '#dc2626';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    const targetY = getY(15);
                    ctx.beginPath();
                    ctx.moveTo(padding.left, targetY);
                    ctx.lineTo(padding.left + chartWidth, targetY);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Label for target
                    ctx.fillStyle = '#dc2626';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText('Target: 15%', padding.left + 5, targetY - 5);
                }

                // Draw legend
                const legends = [
                    { label: 'SVR', color: '#9333ea' },
                    { label: 'Decision Tree', color: '#16a34a' },
                    { label: 'ANN', color: '#2563eb' },
                    { label: 'Ensemble', color: '#ea580c' }
                ];

                ctx.font = '12px sans-serif';
                let legendX = padding.left + 10;
                const legendY = padding.top + 10;

                legends.forEach((legend, i) => {
                    // Draw line
                    ctx.strokeStyle = legend.color;
                    ctx.lineWidth = legend.label === 'Ensemble' ? 3 : 2;
                    ctx.beginPath();
                    ctx.moveTo(legendX, legendY);
                    ctx.lineTo(legendX + 30, legendY);
                    ctx.stroke();

                    // Draw label
                    ctx.fillStyle = '#374151';
                    ctx.textAlign = 'left';
                    ctx.fillText(legend.label, legendX + 35, legendY + 4);

                    legendX += 130;
                });

            }, [timeSeries]);

            return (
                <div className="w-full overflow-x-auto">
                    <canvas
                        ref={canvasRef}
                        width={800}
                        height={400}
                        className="max-w-full border border-gray-200 rounded"
                    />
                    <p className="text-xs text-gray-500 mt-2 text-center">
                        The chart shows how moisture content decreases over time for each model.
                        The ensemble (orange) combines all three models for the most reliable prediction.
                    </p>
                </div>
            );
        };

        const SolarFishDryerPredictor = () => {
            const [inputData, setInputData] = useState({
                temperature: 30,
                humidity: 60,
                solar_radiation: 800,
                wind_speed: 2.5,
                initial_moisture: 75,
                fish_thickness: 2.5,
                fish_type: 'tilapia'
            });

            const [predictions, setPredictions] = useState(null);
            const [loading, setLoading] = useState(false);
            const [backendStatus, setBackendStatus] = useState({
                connected: false,
                trained: false
            });
            const [modelMetrics, setModelMetrics] = useState(null);
            const [training, setTraining] = useState(false);

            const API_URL = 'https://model-regression.onrender.com/api';
            const fishTypes = ['tilapia', 'catfish', 'mackerel', 'sardine', 'salmon'];

            useEffect(() => {
                checkBackendHealth();
                fetchModelMetrics();
            }, []);

            const checkBackendHealth = async () => {
                try {
                    const response = await fetch(`${API_URL}/health`);
                    const data = await response.json();
                    setBackendStatus({
                        connected: true,
                        trained: data.models_trained
                    });
                } catch (error) {
                    console.error('Backend not connected:', error);
                    setBackendStatus({
                        connected: false,
                        trained: false
                    });
                }
            };

            const fetchModelMetrics = async () => {
                try {
                    const response = await fetch(`${API_URL}/metrics`);
                    const data = await response.json();
                    if (data.success && data.trained) {
                        setModelMetrics(data.metrics);
                    }
                } catch (error) {
                    console.error('Error fetching metrics:', error);
                }
            };

            const trainModels = async () => {
                setTraining(true);
                try {
                    const response = await fetch(`${API_URL}/train`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({})
                    });

                    const data = await response.json();

                    if (data.success) {
                        setModelMetrics(data.metrics);
                        setBackendStatus(prev => ({ ...prev, trained: true }));
                        alert('Models trained successfully!');
                    } else {
                        alert('Training failed: ' + data.error);
                    }
                } catch (error) {
                    console.error('Training error:', error);
                    alert('Failed to train models. Make sure the backend is running.');
                } finally {
                    setTraining(false);
                }
            };

            const predictDryingRate = async () => {
                if (!backendStatus.connected) {
                    alert('Backend is not connected. Please check your backend URL.');
                    return;
                }

                if (!backendStatus.trained) {
                    alert('Models are not trained yet. Please train the models first.');
                    return;
                }

                setLoading(true);

                try {
                    const response = await fetch(`${API_URL}/predict`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(inputData)
                    });

                    const data = await response.json();

                    if (data.success) {
                        setPredictions({
                            svr: data.predictions.svr,
                            decisionTree: data.predictions.decision_tree,
                            ann: data.predictions.ann,
                            ensemble: data.predictions.ensemble,
                            timeSeries: data.time_series,
                            estimatedTime: data.estimated_time.toFixed(1)
                        });
                    } else {
                        alert('Prediction failed: ' + data.error);
                    }
                } catch (error) {
                    console.error('Prediction error:', error);
                    alert('Failed to get predictions. Check your connection.');
                } finally {
                    setLoading(false);
                }
            };

            const handleInputChange = (field, value) => {
                setInputData(prev => ({
                    ...prev,
                    [field]: parseFloat(value) || value
                }));
            };

            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const response = await fetch(`${API_URL}/upload-data`, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.success) {
                        alert(data.message);
                    } else {
                        alert('Upload failed: ' + data.error);
                    }
                } catch (error) {
                    console.error('Upload error:', error);
                    alert('Failed to upload data.');
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-orange-50 p-6">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <div className="flex items-center justify-between flex-wrap gap-4">
                                <div>
                                    <div className="flex items-center gap-3 mb-2">
                                        <Sun />
                                        <h1 className="text-3xl font-bold text-gray-800">Solar Fish Dryer ML System</h1>
                                    </div>
                                    <p className="text-gray-600">Real Machine Learning with SVR, Decision Trees & Neural Networks</p>
                                    <p className="text-xs text-gray-400 mt-1">API: {API_URL}</p>
                                </div>

                                {/* Backend Status */}
                                <div className="flex gap-4 flex-wrap">
                                    <div className={`flex items-center gap-2 px-4 py-2 rounded-lg ${backendStatus.connected ? 'bg-green-100' : 'bg-red-100'}`}>
                                        {backendStatus.connected ? (
                                            <CheckCircle className="text-green-600" />
                                        ) : (
                                            <AlertCircle className="text-red-600" />
                                        )}
                                        <span className={`font-medium text-sm ${backendStatus.connected ? 'text-green-800' : 'text-red-800'}`}>
                                            Backend {backendStatus.connected ? 'Connected' : 'Disconnected'}
                                        </span>
                                    </div>

                                    <div className={`flex items-center gap-2 px-4 py-2 rounded-lg ${backendStatus.trained ? 'bg-blue-100' : 'bg-yellow-100'}`}>
                                        {backendStatus.trained ? (
                                            <CheckCircle className="text-blue-600" />
                                        ) : (
                                            <AlertCircle className="text-yellow-600" />
                                        )}
                                        <span className={`font-medium text-sm ${backendStatus.trained ? 'text-blue-800' : 'text-yellow-800'}`}>
                                            Models {backendStatus.trained ? 'Trained' : 'Not Trained'}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Model Training Section */}
                        {backendStatus.connected && (
                            <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                <h2 className="text-xl font-bold text-gray-800 mb-4">Model Training & Data</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <button
                                            onClick={trainModels}
                                            disabled={training}
                                            className="w-full bg-blue-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-600 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                        >
                                            {training ? (
                                                <>
                                                    <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
                                                    Training Models...
                                                </>
                                            ) : (
                                                <>
                                                    <RefreshCw />
                                                    Train / Retrain Models
                                                </>
                                            )}
                                        </button>
                                        <p className="text-sm text-gray-600 mt-2">Train models using sample data or uploaded data</p>
                                    </div>

                                    <div>
                                        <label className="w-full bg-green-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-600 transition-all flex items-center justify-center gap-2 cursor-pointer">
                                            <Upload />
                                            Upload Your Data (CSV)
                                            <input
                                                type="file"
                                                accept=".csv"
                                                onChange={handleFileUpload}
                                                className="hidden"
                                            />
                                        </label>
                                        <p className="text-sm text-gray-600 mt-2">Upload CSV with your collected data</p>
                                    </div>
                                </div>

                                {/* Model Metrics */}
                                {modelMetrics && (
                                    <div className="mt-6 p-4 bg-gray-50 rounded-lg">
                                        <h3 className="font-semibold text-gray-800 mb-3">Model Performance Metrics</h3>
                                        <div className="grid grid-cols-3 gap-4">
                                            <div>
                                                <div className="text-sm text-gray-600">SVR</div>
                                                <div className="font-mono text-sm">RMSE: {modelMetrics.svr.rmse.toFixed(3)}</div>
                                                <div className="font-mono text-sm">R²: {modelMetrics.svr.r2.toFixed(3)}</div>
                                            </div>
                                            <div>
                                                <div className="text-sm text-gray-600">Decision Tree</div>
                                                <div className="font-mono text-sm">RMSE: {modelMetrics.decision_tree.rmse.toFixed(3)}</div>
                                                <div className="font-mono text-sm">R²: {modelMetrics.decision_tree.r2.toFixed(3)}</div>
                                            </div>
                                            <div>
                                                <div className="text-sm text-gray-600">ANN</div>
                                                <div className="font-mono text-sm">RMSE: {modelMetrics.ann.rmse.toFixed(3)}</div>
                                                <div className="font-mono text-sm">R²: {modelMetrics.ann.r2.toFixed(3)}</div>
                                            </div>
                                        </div>
                                        <div className="mt-2 text-sm text-gray-600">
                                            Trained on {modelMetrics.samples} samples
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* Input Panel */}
                            <div className="lg:col-span-1">
                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                                        <Database />
                                        Input Parameters
                                    </h2>

                                    <div className="space-y-4">
                                        {/* Temperature */}
                                        <div>
                                            <label className="flex items-center gap-2 text-sm font-medium text-gray-700 mb-2">
                                                <Thermometer />
                                                Temperature (°C)
                                            </label>
                                            <input
                                                type="range"
                                                min="20"
                                                max="45"
                                                step="0.5"
                                                value={inputData.temperature}
                                                onChange={(e) => handleInputChange('temperature', e.target.value)}
                                                className="w-full"
                                            />
                                            <div className="text-right text-sm font-semibold text-gray-600">{inputData.temperature}°C</div>
                                        </div>

                                        {/* Humidity */}
                                        <div>
                                            <label className="flex items-center gap-2 text-sm font-medium text-gray-700 mb-2">
                                                <Droplets />
                                                Relative Humidity (%)
                                            </label>
                                            <input
                                                type="range"
                                                min="30"
                                                max="90"
                                                step="1"
                                                value={inputData.humidity}
                                                onChange={(e) => handleInputChange('humidity', e.target.value)}
                                                className="w-full"
                                            />
                                            <div className="text-right text-sm font-semibold text-gray-600">{inputData.humidity}%</div>
                                        </div>

                                        {/* Solar Radiation */}
                                        <div>
                                            <label className="flex items-center gap-2 text-sm font-medium text-gray-700 mb-2">
                                                <Sun />
                                                Solar Radiation (W/m²)
                                            </label>
                                            <input
                                                type="range"
                                                min="300"
                                                max="1200"
                                                step="50"
                                                value={inputData.solar_radiation}
                                                onChange={(e) => handleInputChange('solar_radiation', e.target.value)}
                                                className="w-full"
                                            />
                                            <div className="text-right text-sm font-semibold text-gray-600">{inputData.solar_radiation} W/m²</div>
                                        </div>

                                        {/* Wind Speed */}
                                        <div>
                                            <label className="flex items-center gap-2 text-sm font-medium text-gray-700 mb-2">
                                                <Wind />
                                                Wind Speed (m/s)
                                            </label>
                                            <input
                                                type="range"
                                                min="0"
                                                max="8"
                                                step="0.5"
                                                value={inputData.wind_speed}
                                                onChange={(e) => handleInputChange('wind_speed', e.target.value)}
                                                className="w-full"
                                            />
                                            <div className="text-right text-sm font-semibold text-gray-600">{inputData.wind_speed} m/s</div>
                                        </div>

                                        {/* Initial Moisture */}
                                        <div>
                                            <label className="flex items-center gap-2 text-sm font-medium text-gray-700 mb-2">
                                                <Activity />
                                                Initial Moisture Content (%)
                                            </label>
                                            <input
                                                type="range"
                                                min="60"
                                                max="85"
                                                step="1"
                                                value={inputData.initial_moisture}
                                                onChange={(e) => handleInputChange('initial_moisture', e.target.value)}
                                                className="w-full"
                                            />
                                            <div className="text-right text-sm font-semibold text-gray-600">{inputData.initial_moisture}%</div>
                                        </div>

                                        {/* Fish Thickness */}
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2 block">
                                                Fish Thickness (cm)
                                            </label>
                                            <input
                                                type="range"
                                                min="1"
                                                max="5"
                                                step="0.5"
                                                value={inputData.fish_thickness}
                                                onChange={(e) => handleInputChange('fish_thickness', e.target.value)}
                                                className="w-full"
                                            />
                                            <div className="text-right text-sm font-semibold text-gray-600">{inputData.fish_thickness} cm</div>
                                        </div>

                                        {/* Fish Type */}
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2 block">
                                                Fish Type
                                            </label>
                                            <select
                                                value={inputData.fish_type}
                                                onChange={(e) => handleInputChange('fish_type', e.target.value)}
                                                className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
                                            >
                                                {fishTypes.map(type => (
                                                    <option key={type} value={type}>
                                                        {type.charAt(0).toUpperCase() + type.slice(1)}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>

                                        {/* Predict Button */}
                                        <button
                                            onClick={predictDryingRate}
                                            disabled={loading || !backendStatus.trained}
                                            className="w-full bg-gradient-to-r from-blue-500 to-orange-500 text-white font-bold py-3 px-4 rounded-lg hover:from-blue-600 hover:to-orange-600 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                        >
                                            {loading ? (
                                                <>
                                                    <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
                                                    Predicting...
                                                </>
                                            ) : (
                                                <>
                                                    <TrendingUp />
                                                    Predict Drying Rate
                                                </>
                                            )}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Results Panel */}
                            <div className="lg:col-span-2 space-y-6">
                                {predictions ? (
                                    <>
                                        {/* Model Predictions with Explanations */}
                                        <div className="bg-white rounded-lg shadow-lg p-6">
                                            <h2 className="text-xl font-bold text-gray-800 mb-4">Model Predictions & Comparison</h2>

                                            {/* Main Prediction Cards */}
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                                                <div className="bg-gradient-to-br from-purple-50 to-purple-100 p-4 rounded-lg border-2 border-purple-200">
                                                    <div className="text-sm text-gray-600 mb-1 font-semibold">SVR Model</div>
                                                    <div className="text-2xl font-bold text-purple-700">{predictions.svr.toFixed(2)}</div>
                                                    <div className="text-xs text-gray-500">%/hour</div>
                                                    <div className="text-xs text-gray-600 mt-2">Robust & Smooth</div>
                                                </div>
                                                <div className="bg-gradient-to-br from-green-50 to-green-100 p-4 rounded-lg border-2 border-green-200">
                                                    <div className="text-sm text-gray-600 mb-1 font-semibold">Decision Tree</div>
                                                    <div className="text-2xl font-bold text-green-700">{predictions.decisionTree.toFixed(2)}</div>
                                                    <div className="text-xs text-gray-500">%/hour</div>
                                                    <div className="text-xs text-gray-600 mt-2">Interpretable</div>
                                                </div>
                                                <div className="bg-gradient-to-br from-blue-50 to-blue-100 p-4 rounded-lg border-2 border-blue-200">
                                                    <div className="text-sm text-gray-600 mb-1 font-semibold">ANN Model</div>
                                                    <div className="text-2xl font-bold text-blue-700">{predictions.ann.toFixed(2)}</div>
                                                    <div className="text-xs text-gray-500">%/hour</div>
                                                    <div className="text-xs text-gray-600 mt-2">High Accuracy</div>
                                                </div>
                                                <div className="bg-gradient-to-br from-orange-50 to-orange-100 p-4 rounded-lg border-2 border-orange-300">
                                                    <div className="text-sm text-gray-600 mb-1 font-semibold">🎯 Ensemble</div>
                                                    <div className="text-2xl font-bold text-orange-700">{predictions.ensemble.toFixed(2)}</div>
                                                    <div className="text-xs text-gray-500">%/hour</div>
                                                    <div className="text-xs text-orange-600 font-semibold mt-2">Best Combined</div>
                                                </div>
                                            </div>

                                            {/* Visual Comparison Bar */}
                                            <div className="mb-6 p-4 bg-gray-50 rounded-lg">
                                                <h3 className="text-sm font-semibold text-gray-700 mb-3">Drying Rate Comparison</h3>
                                                {(() => {
                                                    const maxRate = Math.max(predictions.svr, predictions.decisionTree, predictions.ann, predictions.ensemble);
                                                    return (
                                                        <div className="space-y-3">
                                                            <div>
                                                                <div className="flex justify-between text-xs mb-1">
                                                                    <span className="text-purple-700 font-semibold">SVR</span>
                                                                    <span className="text-purple-700">{predictions.svr.toFixed(2)}%/hr</span>
                                                                </div>
                                                                <div className="w-full bg-purple-100 rounded-full h-3">
                                                                    <div className="bg-purple-600 h-3 rounded-full" style={{width: `${(predictions.svr / maxRate) * 100}%`}}></div>
                                                                </div>
                                                            </div>
                                                            <div>
                                                                <div className="flex justify-between text-xs mb-1">
                                                                    <span className="text-green-700 font-semibold">Decision Tree</span>
                                                                    <span className="text-green-700">{predictions.decisionTree.toFixed(2)}%/hr</span>
                                                                </div>
                                                                <div className="w-full bg-green-100 rounded-full h-3">
                                                                    <div className="bg-green-600 h-3 rounded-full" style={{width: `${(predictions.decisionTree / maxRate) * 100}%`}}></div>
                                                                </div>
                                                            </div>
                                                            <div>
                                                                <div className="flex justify-between text-xs mb-1">
                                                                    <span className="text-blue-700 font-semibold">ANN</span>
                                                                    <span className="text-blue-700">{predictions.ann.toFixed(2)}%/hr</span>
                                                                </div>
                                                                <div className="w-full bg-blue-100 rounded-full h-3">
                                                                    <div className="bg-blue-600 h-3 rounded-full" style={{width: `${(predictions.ann / maxRate) * 100}%`}}></div>
                                                                </div>
                                                            </div>
                                                            <div>
                                                                <div className="flex justify-between text-xs mb-1">
                                                                    <span className="text-orange-700 font-bold">Ensemble (Final)</span>
                                                                    <span className="text-orange-700 font-bold">{predictions.ensemble.toFixed(2)}%/hr</span>
                                                                </div>
                                                                <div className="w-full bg-orange-100 rounded-full h-3 border border-orange-300">
                                                                    <div className="bg-orange-600 h-3 rounded-full" style={{width: `${(predictions.ensemble / maxRate) * 100}%`}}></div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })()}
                                            </div>

                                            {/* Model Explanations */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                                                <div className="p-3 bg-purple-50 rounded border-l-4 border-purple-500">
                                                    <div className="text-sm font-semibold text-purple-800">🔷 SVR (Support Vector Regression)</div>
                                                    <div className="text-xs text-gray-700 mt-1">Handles non-linear patterns smoothly, resistant to outliers</div>
                                                </div>
                                                <div className="p-3 bg-green-50 rounded border-l-4 border-green-500">
                                                    <div className="text-sm font-semibold text-green-800">🌳 Decision Tree</div>
                                                    <div className="text-xs text-gray-700 mt-1">Easy to interpret, shows clear decision rules</div>
                                                </div>
                                                <div className="p-3 bg-blue-50 rounded border-l-4 border-blue-500">
                                                    <div className="text-sm font-semibold text-blue-800">🧠 ANN (Artificial Neural Network)</div>
                                                    <div className="text-xs text-gray-700 mt-1">Learns complex patterns, highest accuracy potential</div>
                                                </div>
                                                <div className="p-3 bg-orange-50 rounded border-l-4 border-orange-500">
                                                    <div className="text-sm font-semibold text-orange-800">🎯 Ensemble Learning</div>
                                                    <div className="text-xs text-gray-700 mt-1">Combines all models for most reliable prediction</div>
                                                </div>
                                            </div>

                                            {/* Estimated Time */}
                                            <div className="p-4 bg-gradient-to-r from-blue-50 to-orange-50 rounded-lg border-2 border-blue-200">
                                                <div className="text-sm text-gray-600 mb-1">⏱️ Estimated Drying Time (to reach 15% moisture)</div>
                                                <div className="text-3xl font-bold text-blue-700">{predictions.estimatedTime} hours</div>
                                                <div className="text-xs text-gray-600 mt-2">Based on ensemble prediction</div>
                                            </div>
                                        </div>

                                        {/* Visual Chart: Moisture Content Over Time */}
                                        <div className="bg-white rounded-lg shadow-lg p-6">
                                            <h2 className="text-xl font-bold text-gray-800 mb-4">📊 Moisture Content Over Time</h2>

                                            {/* Simple Line Chart using Canvas */}
                                            <div className="mb-6">
                                                <MoistureChart timeSeries={predictions.timeSeries} />
                                            </div>

                                            {/* Summary Stats */}
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                                                <div className="p-3 bg-purple-50 rounded-lg text-center">
                                                    <div className="text-xs text-gray-600">SVR Final</div>
                                                    <div className="text-lg font-bold text-purple-700">
                                                        {predictions.timeSeries[predictions.timeSeries.length - 1]?.svr?.toFixed(1) || '-'}%
                                                    </div>
                                                </div>
                                                <div className="p-3 bg-green-50 rounded-lg text-center">
                                                    <div className="text-xs text-gray-600">Decision Tree Final</div>
                                                    <div className="text-lg font-bold text-green-700">
                                                        {predictions.timeSeries[predictions.timeSeries.length - 1]?.decision_tree?.toFixed(1) || '-'}%
                                                    </div>
                                                </div>
                                                <div className="p-3 bg-blue-50 rounded-lg text-center">
                                                    <div className="text-xs text-gray-600">ANN Final</div>
                                                    <div className="text-lg font-bold text-blue-700">
                                                        {predictions.timeSeries[predictions.timeSeries.length - 1]?.ann?.toFixed(1) || '-'}%
                                                    </div>
                                                </div>
                                                <div className="p-3 bg-orange-50 rounded-lg text-center border-2 border-orange-300">
                                                    <div className="text-xs text-gray-600">Ensemble Final</div>
                                                    <div className="text-lg font-bold text-orange-700">
                                                        {predictions.timeSeries[predictions.timeSeries.length - 1]?.ensemble?.toFixed(1) || '-'}%
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Simplified Table View */}
                                            <details className="mt-4">
                                                <summary className="cursor-pointer text-sm font-semibold text-gray-700 hover:text-blue-600">
                                                    📋 Show Detailed Data Table
                                                </summary>
                                                <div className="overflow-x-auto mt-3">
                                                    <table className="w-full text-sm">
                                                        <thead>
                                                            <tr className="border-b-2 border-gray-300">
                                                                <th className="text-left p-2">Hour</th>
                                                                <th className="text-right p-2 text-purple-700">SVR (%)</th>
                                                                <th className="text-right p-2 text-green-700">Tree (%)</th>
                                                                <th className="text-right p-2 text-blue-700">ANN (%)</th>
                                                                <th className="text-right p-2 text-orange-700 font-bold">Ensemble (%)</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {predictions.timeSeries.map((point, index) => (
                                                                <tr key={index} className="border-b border-gray-200 hover:bg-gray-50">
                                                                    <td className="p-2 font-semibold">{point.hour}</td>
                                                                    <td className="text-right p-2 text-purple-600">{point.svr?.toFixed(1) || '-'}</td>
                                                                    <td className="text-right p-2 text-green-600">{point.decision_tree?.toFixed(1) || '-'}</td>
                                                                    <td className="text-right p-2 text-blue-600">{point.ann?.toFixed(1) || '-'}</td>
                                                                    <td className="text-right p-2 font-semibold text-orange-600">{point.ensemble?.toFixed(1) || '-'}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </details>
                                        </div>

                                        {/* Recommendations */}
                                        <div className="bg-white rounded-lg shadow-lg p-6">
                                            <h2 className="text-xl font-bold text-gray-800 mb-4">Recommendations</h2>
                                            <div className="space-y-3">
                                                {predictions.ensemble > 5 && (
                                                    <div className="p-3 bg-green-50 border-l-4 border-green-500 text-green-800">
                                                        <strong>Excellent Conditions:</strong> High drying rate expected. Monitor regularly to prevent over-drying.
                                                    </div>
                                                )}
                                                {predictions.ensemble >= 3 && predictions.ensemble <= 5 && (
                                                    <div className="p-3 bg-blue-50 border-l-4 border-blue-500 text-blue-800">
                                                        <strong>Good Conditions:</strong> Moderate drying rate. Continue monitoring environmental parameters.
                                                    </div>
                                                )}
                                                {predictions.ensemble < 3 && (
                                                    <div className="p-3 bg-yellow-50 border-l-4 border-yellow-500 text-yellow-800">
                                                        <strong>Suboptimal Conditions:</strong> Low drying rate. Consider improving ventilation or waiting for better weather.
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </>
                                ) : (
                                    <div className="bg-white rounded-lg shadow-lg p-12 text-center">
                                        <TrendingUp className="w-16 h-16 text-gray-300 mx-auto mb-4" />
                                        <h3 className="text-xl font-semibold text-gray-600 mb-2">No Predictions Yet</h3>
                                        <p className="text-gray-500">
                                            {!backendStatus.connected
                                                ? 'Backend not connected. Check the API URL.'
                                                : !backendStatus.trained
                                                ? 'Train the models first, then enter parameters and predict'
                                                : 'Enter your environmental parameters and click "Predict Drying Rate"'
                                            }
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="mt-6 bg-white rounded-lg shadow-lg p-4 text-center text-sm text-gray-600">
                            <p>Solar Fish Dryer ML System | Real ML Models: Support Vector Regression, Decision Trees, Artificial Neural Networks</p>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<SolarFishDryerPredictor />, document.getElementById('root'));
    </script>
</body>
</html>
